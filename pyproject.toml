[project]
name = "minisearch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ahmed", email = "ahmad_801a@ai.kfs.edu.eg" }
]
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.7.22",
]

[project.scripts]
minisearch = "minisearch:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
